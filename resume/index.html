<style>
:root{
  --bg:#EAEBE5; --surface:#FFFFFF; --text-1:#000000; --text-2:#5A5C55; --text-3:#8A8C83;
  --border:rgba(0,0,0,.13); --border-2:rgba(0,0,0,.26); --accent:#E72604;
  --f:'Switzer',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --display:var(--f);
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; --maxw:760px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--f);font-size:15px;
  line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 28px}

/* bridge */
.bridge{position:sticky;top:0;z-index:50;background:rgba(234,235,229,.82);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border)}
.bridge-in{display:flex;align-items:center;justify-content:space-between;height:52px}
.bridge a.back{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-1)}
.bridge a.back:hover{color:var(--accent);text-decoration:none}
.bridge a.back svg{width:15px;height:15px;stroke:var(--accent)}
.print-btn{font:inherit;font-size:12.5px;font-weight:500;color:var(--text-1);background:transparent;
  border:1px solid var(--border-2);border-radius:999px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.print-btn:hover{border-color:var(--text-2)}
.print-btn svg{width:14px;height:14px;stroke:currentColor;fill:none}

/* header */
.r-head{padding:44px 0 22px}
.r-head h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);
  letter-spacing:-.03em;margin:0;line-height:1.05;color:var(--accent)}
.r-head .role{font-size:15.5px;color:var(--text-2);margin-top:6px}
.sep{margin:0 7px;color:var(--text-3)}

/* ---- the PDF itself ----
   A4 is 595x842pt, so the frame carries that ratio and the page scrolls
   rather than the viewer letterboxing a one-page résumé. */
.r-main{padding-bottom:8px}
.pdf-wrap{margin-top:4px;border:1px solid var(--border);border-radius:10px;overflow:hidden;
  background:var(--surface);box-shadow:0 10px 30px -14px rgba(0,0,0,.18)}
.pdf-frame{display:block;width:100%;aspect-ratio:595/842;border:0}

/* <object> only shows this child when it cannot render the file */
.pdf-fallback{display:block;height:100%}
.pdf-fallback img{display:block;width:100%;height:auto}
a.print-btn,a.print-btn:hover{text-decoration:none}

/* The same first page as a flat image. A phone browser will not reliably
   render a PDF in the page — iOS Safari paints an empty box rather than
   falling back to the <object>'s children — so small screens get the
   picture instead of a frame that might come up blank. Tapping it opens
   the real file. */
.pdf-shot{display:none;border:1px solid var(--border);border-radius:10px;overflow:hidden;
  background:var(--surface);box-shadow:0 10px 30px -14px rgba(0,0,0,.18)}
.pdf-shot img{display:block;width:100%;height:auto}

.pdf-note{margin:14px 0 0;font-size:13px;color:var(--text-3);text-align:center}
.pdf-note a{color:var(--text-2)}

@media(max-width:700px){
  .pdf-wrap{display:none}
  .pdf-shot{display:block;margin-top:4px}
  .pdf-note{margin-top:16px;font-size:14px}
}

</style>
