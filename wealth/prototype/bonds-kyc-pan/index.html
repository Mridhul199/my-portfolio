<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth · KYC · PAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bonds-shared/motion.css">
<style>
  :root{
    --grad-1:#7C3AED; --grad-2:#6D5CF6; --grad-3:#4F7DF3;
    --ink:#F4F1FA; --ink-2:#B8B3CC; --ink-3:#7A7593;
    --canvas:#0A0714; --surface:#160F24;
    --border:#2A2138;
    --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#DCDAE8}
  body{font-family:var(--f);color:var(--ink);display:flex;justify-content:center;padding:28px 12px;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  button{font-family:var(--f);cursor:pointer;border:none;background:none}

  .device{width:402px;max-width:100%;height:874px;background:var(--surface);border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(30,15,80,.28),0 0 0 10px #0E0B1E;position:relative;display:flex;flex-direction:column}

  .content{flex:1;padding:40px 24px 20px;overflow-y:auto}
  .top-row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .back-btn{width:36px;height:36px;border-radius:50%;background:var(--canvas);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .back-btn svg{width:15px;height:15px;stroke:var(--ink-2)}
  .steps{flex:1;display:flex;gap:6px}
  .steps span{flex:1;height:4px;border-radius:999px;background:var(--border)}
  .steps span.done{background:var(--grad-2)}
  .step-lbl{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:6px}

  h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
  .sub{font-size:13px;color:var(--ink-2);font-weight:500;line-height:1.5;margin-bottom:26px}

  .field-lbl{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
  .field{background:var(--canvas);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:14px;font-weight:700;color:var(--ink)}
  .field.ph{color:var(--ink-3);font-weight:500}
  .field.focus{border-color:var(--grad-2)}

  .trust-note{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:var(--ink-3);line-height:1.5;font-weight:500;margin-top:6px}
  .trust-note svg{width:14px;height:14px;stroke:var(--ink-3);flex-shrink:0;margin-top:1px}

  .actions{padding:14px 24px 24px}
  .cta{display:block;background:var(--grad-2);color:#fff;border-radius:13px;padding:15px;font-size:14.5px;font-weight:700;text-align:center}
</style>
</head>
<body>

<div class="device">
  <div class="content">
    <div class="top-row">
      <a class="back-btn" href="../bonds-otp/index.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div class="steps"><span class="done"></span><span></span><span></span></div>
    </div>

    <div class="step-lbl">STEP 1 OF 3 · PAN DETAILS</div>
    <h1>Verify your PAN</h1>
    <div class="sub">Required by SEBI to open your investment account.</div>

    <div class="field-lbl">PAN number</div>
    <div class="field">ABCDE1234F</div>

    <div class="field-lbl">Name as per PAN</div>
    <div class="field">John Doe</div>

    <div class="field-lbl">Date of birth</div>
    <div class="field">14 / 03 / 1996</div>

    <div class="trust-note">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      Used only for regulatory KYC verification and encrypted end-to-end.
    </div>
  </div>

  <div class="actions">
    <a class="cta" href="../bonds-kyc-aadhaar/index.html">Continue</a>
  </div>
</div>

<script src="../bonds-shared/ui.js"></script>
</body>
</html>
