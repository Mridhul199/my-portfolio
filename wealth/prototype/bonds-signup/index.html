<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth · Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bonds-shared/motion.css">
<style>
  :root{
    --grad-1:#7C3AED; --grad-2:#6D5CF6; --grad-3:#4F7DF3;
    --ink:#F4F1FA; --ink-2:#B8B3CC; --ink-3:#7A7593;
    --canvas:#0A0714; --surface:#160F24;
    --border:#2A2138;
    --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#DCDAE8}
  body{font-family:var(--f);color:var(--ink);display:flex;justify-content:center;padding:28px 12px;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  button{font-family:var(--f);cursor:pointer;border:none;background:none}

  .device{width:402px;max-width:100%;height:874px;background:var(--surface);border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(30,15,80,.28),0 0 0 10px #0E0B1E;position:relative;display:flex;flex-direction:column}

  .content{flex:1;padding:40px 24px 20px;overflow-y:auto}
  .mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--grad-1),var(--grad-3));display:flex;align-items:center;justify-content:center;margin-bottom:26px}
  .mark svg{width:20px;height:20px;stroke:#fff}

  h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
  .sub{font-size:13px;color:var(--ink-2);font-weight:500;line-height:1.5;margin-bottom:28px}

  .field-lbl{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
  .phone-input{display:flex;align-items:center;gap:10px;background:var(--canvas);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:18px}
  .phone-input .cc{font-size:14.5px;font-weight:700;color:var(--ink-2);padding-right:10px;border-right:1.5px solid var(--border)}
  .phone-input .num{font-size:14.5px;font-weight:700;color:var(--ink);flex:1}
  .phone-input.focus{border-color:var(--grad-2)}

  .terms{font-size:11px;color:var(--ink-3);line-height:1.5;margin-bottom:0}
  .terms a{color:var(--grad-2);font-weight:700}

  .actions{padding:14px 24px 24px}
  .cta{display:block;background:var(--grad-2);color:#fff;border-radius:13px;padding:15px;font-size:14.5px;font-weight:700;text-align:center}
  .alt{display:block;text-align:center;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:14px}
  .alt b{color:var(--grad-2);font-weight:700}
</style>
</head>
<body>

<div class="device">
  <div class="content">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg></div>
    <h1>Let's get started</h1>
    <div class="sub">Enter your mobile number — we'll send a one-time code to verify it's you.</div>

    <div class="field-lbl">Mobile number</div>
    <div class="phone-input focus">
      <span class="cc">🇮🇳 +91</span>
      <span class="num">98765 43210</span>
    </div>

    <div class="terms">By continuing, you agree to Wealth's <a>Terms of Service</a> and <a>Privacy Policy</a>.</div>
  </div>

  <div class="actions">
    <a class="cta" href="../bonds-otp/index.html">Send OTP</a>
    <a class="alt" href="../bonds-otp/index.html">Already have an account? <b>Log in</b></a>
  </div>
</div>

<script src="../bonds-shared/ui.js"></script>
</body>
</html>
