<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth · KYC · Selfie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bonds-shared/motion.css">
<style>
  :root{
    --grad-1:#7C3AED; --grad-2:#6D5CF6; --grad-3:#4F7DF3;
    --ink:#F4F1FA; --ink-2:#B8B3CC; --ink-3:#7A7593;
    --canvas:#0A0714; --surface:#160F24;
    --border:#2A2138;
    --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#DCDAE8}
  body{font-family:var(--f);color:var(--ink);display:flex;justify-content:center;padding:28px 12px;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  button{font-family:var(--f);cursor:pointer;border:none;background:none}

  .device{width:402px;max-width:100%;height:874px;background:var(--surface);border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(30,15,80,.28),0 0 0 10px #0E0B1E;position:relative;display:flex;flex-direction:column}

  .content{flex:1;padding:40px 24px 20px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
  .top-row{display:flex;align-items:center;gap:12px;margin-bottom:24px;width:100%}
  .back-btn{width:36px;height:36px;border-radius:50%;background:var(--canvas);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .back-btn svg{width:15px;height:15px;stroke:var(--ink-2)}
  .steps{flex:1;display:flex;gap:6px}
  .steps span{flex:1;height:4px;border-radius:999px;background:var(--border)}
  .steps span.done{background:var(--grad-2)}
  .step-lbl{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:6px;width:100%;text-align:left}

  h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;width:100%;text-align:left}
  .sub{font-size:13px;color:var(--ink-2);font-weight:500;line-height:1.5;margin-bottom:32px;width:100%;text-align:left}

  .cam-frame{width:200px;height:200px;border-radius:50%;border:3px dashed rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin-bottom:22px;position:relative;background:var(--canvas)}
  .cam-frame svg{width:74px;height:74px;stroke:var(--ink-3)}
  .cam-frame::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:var(--grad-2);border-right-color:var(--grad-2)}

  .tips{text-align:left;width:100%;margin-top:auto}
  .tip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-weight:500;margin-bottom:8px}
  .tip svg{width:14px;height:14px;stroke:var(--up,#22C55E);flex-shrink:0}

  .actions{padding:14px 24px 24px}
  .cta{display:block;background:var(--grad-2);color:#fff;border-radius:13px;padding:15px;font-size:14.5px;font-weight:700;text-align:center}
</style>
</head>
<body>

<div class="device">
  <div class="content">
    <div class="top-row">
      <a class="back-btn" href="../bonds-kyc-aadhaar/index.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div class="steps"><span class="done"></span><span class="done"></span><span class="done"></span></div>
    </div>

    <div class="step-lbl">STEP 3 OF 3 · LIVENESS CHECK</div>
    <h1>Quick selfie check</h1>
    <div class="sub">We'll match this against your Aadhaar photo to confirm it's really you.</div>

    <div class="cam-frame">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    </div>

    <div class="tips">
      <div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Good lighting, face centred in frame</div>
      <div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Remove glasses or masks</div>
    </div>
  </div>

  <div class="actions">
    <a class="cta" href="../bonds-kyc-verify/index.html">Capture selfie</a>
  </div>
</div>

<script src="../bonds-shared/ui.js"></script>
</body>
</html>
