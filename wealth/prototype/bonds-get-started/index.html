<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth · Get started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bonds-shared/motion.css">
<style>
  :root{
    --grad-1:#7C3AED; --grad-2:#6D5CF6; --grad-3:#4F7DF3;
    --ink:#F4F1FA; --ink-2:#B8B3CC; --ink-3:#7A7593;
    --canvas:#0A0714; --surface:#160F24;
    --border:#2A2138;
    --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#DCDAE8}
  body{font-family:var(--f);color:var(--ink);display:flex;justify-content:center;padding:28px 12px;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  button{font-family:var(--f);cursor:pointer;border:none;background:none}

  .device{width:402px;max-width:100%;height:874px;background:var(--canvas);border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(30,15,80,.28),0 0 0 10px #0E0B1E;position:relative;display:flex;flex-direction:column}

  .hero-full{position:relative;height:430px;flex-shrink:0;overflow:hidden;background:#000}

  .hero-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;z-index:2}
  .hero-brand{display:flex;align-items:center;gap:7px}
  .hero-brand .mark{width:20px;height:auto}
  .hero-brand .word{font-size:15.5px;font-weight:800;color:#fff;letter-spacing:-.2px}
  .hero-skip{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.55)}

  .ribbon-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .ribbon-wrap svg{width:120%;height:120%;filter:drop-shadow(0 0 46px rgba(139,92,246,.55)) drop-shadow(0 0 90px rgba(124,58,237,.3))}
  .blade{filter:blur(.6px);animation:bladeDrift 6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes bladeDrift{
    0%,100%{transform:rotate(-3deg) translate(0,0) scale(1)}
    50%{transform:rotate(3deg) translate(0,-7px) scale(1.03)}
  }
  @media (prefers-reduced-motion: reduce){.blade{animation:none}}

  .hero-fade{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top, var(--canvas) 0%, rgba(10,7,20,.75) 45%, transparent 100%);z-index:1;pointer-events:none}

  .headline-block{position:relative;z-index:2;margin-top:-64px;padding:0 22px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;overflow-y:auto;scrollbar-width:none}
  .headline-block::-webkit-scrollbar{display:none}
  h1{font-size:37px;font-weight:800;letter-spacing:-1px;line-height:1.06;margin-bottom:16px}
  .sub{font-size:13.5px;color:var(--ink-2);font-weight:500;line-height:1.55}

  .actions{padding:16px 20px 24px;flex-shrink:0}
  .cta{display:block;background:linear-gradient(120deg,var(--grad-1),var(--grad-2));color:#fff;border-radius:999px;padding:17px;font-size:15px;font-weight:800;text-align:center;box-shadow:0 12px 28px rgba(124,58,237,.35)}
  .alt{display:block;text-align:center;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:14px}
  .alt b{color:var(--grad-2);font-weight:700}
</style>
</head>
<body>
