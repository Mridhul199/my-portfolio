<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth · Verifying</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bonds-shared/motion.css">
<style>
  :root{
    --grad-1:#7C3AED; --grad-2:#6D5CF6; --grad-3:#4F7DF3;
    --ink:#F4F1FA; --ink-2:#B8B3CC; --ink-3:#7A7593;
    --canvas:#0A0714; --surface:#160F24;
    --border:#2A2138;
    --up:#22C55E;
    --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#DCDAE8}
  body{font-family:var(--f);color:var(--ink);display:flex;justify-content:center;padding:28px 12px;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}

  .device{width:402px;max-width:100%;height:874px;background:var(--surface);border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(30,15,80,.28),0 0 0 10px #0E0B1E;position:relative;display:flex;flex-direction:column}

  .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .state{display:none;flex-direction:column;align-items:center}
  .state.active{display:flex}

  .spinner{width:56px;height:56px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--grad-2);animation:spin 0.9s linear infinite;margin-bottom:24px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #processing h1{font-size:17px;font-weight:800;margin-bottom:8px}
  #processing .sub{font-size:12.5px;color:var(--ink-2);font-weight:500;line-height:1.5;max-width:260px}

  .check-ring{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--up),#0FA968);display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 12px 30px rgba(15,169,104,.28)}
  .check-ring svg{width:34px;height:34px;stroke:#fff}
  #success h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
  #success .sub{font-size:13px;color:var(--ink-2);font-weight:500;line-height:1.5;max-width:280px;margin-bottom:28px}

  .kyc-recap{width:100%;background:var(--canvas);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:left;margin-bottom:8px}
  .kyc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12.5px}
  .kyc-row .l{color:var(--ink-3);font-weight:600}
  .kyc-row .v{color:var(--up);font-weight:700;display:flex;align-items:center;gap:5px}
  .kyc-row .v svg{width:13px;height:13px;stroke:var(--up)}

  .actions{padding:14px 24px 24px}
  .cta{display:block;background:var(--grad-2);color:#fff;border-radius:13px;padding:15px;font-size:14.5px;font-weight:700;text-align:center}
</style>
</head>
<body>

<div class="device">
  <div class="content">

    <div class="state active" id="processing">
      <div class="spinner"></div>
      <h1>Verifying your details</h1>
      <div class="sub">Matching your selfie with Aadhaar records and confirming PAN details. This usually takes a few seconds.</div>
    </div>

    <div class="state" id="success">
      <div class="check-ring motion-pop-in"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      <h1>You're all set!</h1>
      <div class="sub">Your KYC is verified. You can now invest in bonds on Wealth.</div>

      <div class="kyc-recap">
        <div class="kyc-row"><span class="l">PAN verification</span><span class="v"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Verified</span></div>
        <div class="kyc-row"><span class="l">Aadhaar e-KYC</span><span class="v"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Verified</span></div>
        <div class="kyc-row"><span class="l">Liveness check</span><span class="v"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Verified</span></div>
      </div>
    </div>

  </div>

  <div class="actions" id="actionBar" style="display:none">
    <a class="cta" href="../bonds-discovery/index.html">Start exploring bonds</a>
  </div>
</div>

<script src="../bonds-shared/ui.js"></script>
<script>
  setTimeout(() => {
    document.getElementById('processing').classList.remove('active');
    document.getElementById('success').classList.add('active');
    document.getElementById('actionBar').style.display = 'block';
  }, 2200);
</script>

</body>
</html>
