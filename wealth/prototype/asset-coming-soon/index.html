<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bonds-shared/motion.css">
<style>
  :root{
    --bg:#0A0714; --surface:#160F24; --surface-2:#1D1530;
    --border:#2A2138;
    --ink:#F4F1FA; --ink-2:#B8B3CC; --ink-3:#7A7593;
    --accent-1:#7C3AED; --accent-2:#6D5CF6; --accent-3:#4F7DF3;
    --up:#22C55E; --up-tint:#12291C;
    --gold:#F5B860; --gold-tint:#2B2013;
    --amber:#FB923C;
    --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#DCDAE8}
  body{font-family:var(--f);color:var(--ink);display:flex;justify-content:center;padding:28px 12px;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  button{font-family:var(--f);cursor:pointer;border:none;background:none;padding:0}

  .device{width:402px;max-width:100%;height:874px;background:var(--bg);border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(30,15,80,.28),0 0 0 10px #0E0B1E;position:relative}
  .scroll{height:100%;overflow-y:auto;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  .page{padding:18px 20px 90px}

  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .back-btn svg{width:15px;height:15px;stroke:var(--ink-2)}
  .topbar h1{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.2px}

  .cs-wrap{margin-top:40px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 8px}
  .cs-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--accent-1),var(--accent-3));display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 14px 32px rgba(109,92,246,.28)}
  .cs-icon svg{width:28px;height:28px;stroke:#fff}
  .cs-wrap h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:10px}
  .cs-wrap p{font-size:13px;color:var(--ink-2);font-weight:500;line-height:1.55;max-width:280px;margin-bottom:28px}

  .cs-actions{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px}
  .cs-notify{background:var(--accent-2);color:#fff;border-radius:13px;padding:14px;font-size:13.5px;font-weight:700;text-align:center;width:100%}
  .cs-explore{color:var(--accent-2);font-size:13px;font-weight:700;text-align:center;padding:6px;width:100%}

  .toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);background:rgba(18,14,38,.94);color:#fff;font-size:12.5px;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;white-space:nowrap;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="device">
<div class="scroll">

  <div class="page">
    <div class="topbar">
      <a class="back-btn" href="../bonds-discovery/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1 id="pageTitle"></h1>
    </div>

    <div class="cs-wrap">
      <div class="cs-icon motion-pop-in" id="csIcon"></div>
      <h2 id="csHeadline"></h2>
      <p id="csBody"></p>
      <div class="cs-actions">
        <button class="cs-notify" id="notifyBtn">Notify me when this launches</button>
        <a class="cs-explore" href="../bonds-listing/index.html">Explore Bonds instead</a>
      </div>
    </div>
  </div>

</div>
</div>

<script src="../bonds-shared/ui.js"></script>
<script>
  const ASSET_INFO = {
    stocks: {
      label: 'Stocks',
      icon: '<path d="M4 19h16M7 15l4-5 3 3 5-7"/><path d="M15 6h4v4"/>',
      headline: 'Stocks are launching soon',
      body: 'Buy and track equities alongside your bond portfolio — one KYC, one login, one place for your wealth.'
    },
    'mutual-funds': {
      label: 'Mutual Funds',
      icon: '<rect x="4" y="14" width="4" height="6" rx="1"/><rect x="10" y="9" width="4" height="11" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/>',
      headline: 'Mutual Funds are launching soon',
      body: 'SIP or lump-sum into curated fund baskets, right from Wealth — alongside the bonds you already hold.'
    }
  };

  const params = new URLSearchParams(window.location.search);
  const asset = ASSET_INFO[params.get('asset')] ? params.get('asset') : 'stocks';
  const info = ASSET_INFO[asset];

  document.title = info.label + ' — Coming soon';
  document.getElementById('pageTitle').textContent = info.label;
  document.getElementById('csIcon').innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${info.icon}</svg>`;
  document.getElementById('csHeadline').textContent = info.headline;
  document.getElementById('csBody').textContent = info.body;

  document.getElementById('notifyBtn').addEventListener('click', () => showToast("We'll let you know when it's ready"));
</script>
</body>
</html>
