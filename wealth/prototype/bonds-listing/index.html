<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Bonds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bonds-shared/motion.css">
<style>
  :root{
    --bg:#0A0714; --surface:#160F24; --surface-2:#1D1530;
    --border:#2A2138;
    --ink:#F4F1FA; --ink-2:#B8B3CC; --ink-3:#7A7593;
    --accent-1:#7C3AED; --accent-2:#6D5CF6; --accent-3:#4F7DF3;
    --up:#22C55E; --up-tint:#12291C;
    --gold:#F5B860; --gold-tint:#2B2013;
    --amber:#FB923C;
    --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#DCDAE8}
  body{font-family:var(--f);color:var(--ink);display:flex;justify-content:center;padding:28px 12px;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  button{font-family:var(--f);cursor:pointer;border:none;background:none;padding:0}

  .device{width:402px;max-width:100%;height:874px;background:var(--bg);border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(30,15,80,.28),0 0 0 10px #0E0B1E;position:relative}
  .scroll{height:100%;overflow-y:auto;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  .page{padding:18px 20px 90px}

  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .back-btn svg{width:15px;height:15px;stroke:var(--ink-2)}
  .topbar h1{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.2px}

  .asset-switcher{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px;margin-bottom:16px}
  .asset-pill{flex:1;text-align:center;padding:9px 4px;border-radius:11px;font-size:12px;font-weight:700;color:var(--ink-2);transition:background .18s,color .18s,box-shadow .18s}
  .asset-pill.active{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(30,15,80,.1)}

  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:11px 16px;color:var(--ink-3);font-size:13px;font-weight:500;margin-bottom:16px}
  .search svg{width:15px;height:15px;flex-shrink:0}

  .filter-row{display:flex;gap:8px;align-items:center;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:5}
  .sort-btn{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700}
  .sort-btn svg{width:13px;height:13px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .chip.on{background:var(--accent-2);border-color:var(--accent-2);color:#fff}

  .result-count{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-bottom:12px}
  .result-count b{color:var(--ink-2)}

  .bond-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
  .bond{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;display:flex;flex-direction:column}
  .bond-top{display:flex;align-items:center;gap:12px;width:100%}
  .bond .mark{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
  .bond .info{flex:1;min-width:0}
  .bond .info .name{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bond .info .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
  .badge.rating{background:var(--gold-tint);color:#F5B860}
  .badge.tenure{background:#1F1830;color:var(--ink-2)}
  .badge.liquid{background:var(--up-tint);color:var(--up)}
  .bond .yield{text-align:right;flex-shrink:0}
  .bond .yield .pct{font-size:17px;font-weight:800;letter-spacing:-.3px}
  .bond .yield.elevated .pct{color:var(--amber)}
  .bond .yield.safe .pct{color:#60A5FA}
  .bond .yield .lbl{font-size:10px;color:var(--ink-3);font-weight:600}
  .bond-foot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .sold-track{flex:1;height:4px;background:#1F1830;border-radius:999px;overflow:hidden}
  .sold-track span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent-3));border-radius:999px}
  .sold-meta{font-size:11px;color:var(--ink-3);white-space:nowrap;font-weight:600;flex-shrink:0}
  .sold-meta b{color:var(--ink-2)}

  .empty-state{text-align:center;padding:30px 16px;color:var(--ink-3);font-size:12.5px;font-weight:500}

  .toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);background:rgba(18,14,38,.94);color:#fff;font-size:12.5px;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;white-space:nowrap;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="device">
<div class="scroll">

  <div class="page">
    <div class="topbar">
      <a class="back-btn" href="../bonds-discovery/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1>All Bonds</h1>
    </div>

    <div class="asset-switcher" id="assetSwitcher"></div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Search bonds, issuers, ISIN
    </div>

    <div class="filter-row">
      <a class="sort-btn" href="../bonds-filters/index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M4 7l3-3 3 3M17 20V4M14 17l3 3 3-3"/></svg>
        Sort
      </a>
      <div class="chips" id="chips">
        <button class="chip" data-tag="short-tenure">Short tenure</button>
        <button class="chip" data-tag="aa-above">AA &amp; above</button>
        <button class="chip" data-tag="under10k">Under ₹10k min</button>
        <button class="chip" data-tag="govt">Govt bonds</button>
        <button class="chip" data-tag="sell6mo">Early exit (6mo+)</button>
        <button class="chip" data-tag="monthly-payout">Monthly interest</button>
      </div>
    </div>

    <div class="result-count" id="resultCount"></div>
    <div class="bond-list" id="bondList"></div>
  </div>

</div>
</div>

<script src="../bonds-shared/bonds-data.js"></script>
<script src="../bonds-shared/ui.js"></script>
<script>
  renderAssetSwitcher('bonds');

  const activeTags = new Set();
  const bondList = Object.values(BONDS);

  const urlTag = new URLSearchParams(window.location.search).get('tag');
  if (urlTag && TAG_TESTS[urlTag]) activeTags.add(urlTag);

  function bondCardHTML(bond, i) {
    return `
      <a class="bond stagger-in" style="animation-delay:${Math.min(i, 6) * 40}ms" href="../bonds-detail/index.html?bond=${bond.id}">
        <div class="bond-top">
          <div class="mark" style="background:linear-gradient(135deg,${bond.grad[0]},${bond.grad[1]})">${bond.initials}</div>
          <div class="info">
            <div class="name">${bond.name}</div>
            <div class="meta">
              <span class="badge rating">${bond.rating}</span>
              <span class="badge tenure">${bond.tenureMonths} mo</span>
              ${bond.liquidityAfterMonths ? `<span class="badge liquid">Sell after ${bond.liquidityAfterMonths}mo</span>` : ''}
            </div>
          </div>
          <div class="yield ${bond.riskTier}"><div class="pct">${bond.ytm.toFixed(2)}%</div><div class="lbl">YTM</div></div>
        </div>
        <div class="bond-foot">
          <div class="sold-track"><span style="width:${bond.soldPct}%"></span></div>
          <div class="sold-meta"><b>${bond.soldPct}% sold</b> · Min ${fmtINR(bond.unitPrice * bond.minUnits)}</div>
        </div>
      </a>`;
  }

  function renderBonds() {
    const matches = bondList.filter(b => [...activeTags].every(tag => TAG_TESTS[tag](b)));
    document.getElementById('resultCount').innerHTML = activeTags.size
      ? `<b>${matches.length}</b> of ${bondList.length} bonds match your filters`
      : `Showing all <b>${bondList.length}</b> bonds`;
    document.getElementById('bondList').innerHTML = matches.length
      ? matches.map(bondCardHTML).join('')
      : `<div class="empty-state">No bonds match these filters right now.<br>Try clearing one to see more results.</div>`;
  }

  function syncActiveUI() {
    document.querySelectorAll('.chip[data-tag]').forEach(node => node.classList.toggle('on', activeTags.has(node.dataset.tag)));
  }

  function toggleTag(tag) {
    if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
    syncActiveUI();
    renderBonds();
  }

  document.querySelectorAll('[data-tag]').forEach(el => el.addEventListener('click', () => toggleTag(el.dataset.tag)));
  syncActiveUI();
  renderBonds();

  if (urlTag && TAG_TESTS[urlTag]) {
    showToast(`Showing bonds matching "${TAG_LABELS[urlTag] || urlTag}"`);
  }
</script>

</body>
</html>
